name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The client plays sound through ALSA.
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  # Speed numbers for every change (DESIGN §5.1.1, #55). Reported in the job
  # summary; doesn't fail the build.
  bench:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build --release -p retrox-tools
      - name: Bench
        run: |
          ./target/release/retrox bench --years 50 | tee bench.txt
          {
            echo '### retrox bench'
            echo '```'
            grep -v '^BENCH ' bench.txt
            echo '```'
            grep '^BENCH ' bench.txt
          } >> "$GITHUB_STEP_SUMMARY"
