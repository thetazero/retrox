[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thetazero/retrox"

[workspace.dependencies]
retrox-sim = { path = "crates/sim" }
retrox-gen = { path = "crates/gen" }
retrox-content = { path = "crates/content" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slotmap = { version = "1.1", features = ["serde"] }
rayon = "1.12"
glam = { version = "0.34", features = ["serde", "bytemuck"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
